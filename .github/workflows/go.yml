name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest

    services:
      timescale:
        image: timescale/timescaledb:2.30.1-pg18
        env:
          POSTGRES_USER: symon
          POSTGRES_PASSWORD: symon
          POSTGRES_DB: symon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symon -d symon_test"
          --health-interval 5s
          --health-retries 20

    env:
      SYMON_TEST_DATABASE_URL: postgres://symon:symon@localhost:5432/symon_test?sslmode=disable

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: client/web/package-lock.json

    - name: Build all
      run: make build-all

    - name: Check dashboard
      working-directory: client/web
      run: npm run check && npm test

    - name: Gofmt
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

    - name: Govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Test
      run: go test -race -v ./...

