name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Build all
      run: make build-all

    - name: Gofmt
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

    - name: Govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Test
      run: go test -race -v ./...

