# Local development stack. Not meant for production.
#   docker compose up --build
# Dashboard: http://localhost:8080
# The agent reports on its own container, not the host.

x-symon-key: &symon-key
  SYMON_KEY: ${SYMON_KEY:-dev-only-key}

services:
  db:
    image: timescale/timescaledb:2.30.1-pg18
    environment:
      POSTGRES_USER: symon
      POSTGRES_PASSWORD: symon
      POSTGRES_DB: symon
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "symon", "-d", "symon"]
      interval: 5s
      retries: 20

  collector:
    build:
      context: .
      target: collector
    environment:
      <<: *symon-key
      SYMON_PORT: "9000"
      SYMON_ALERT_ENDPOINT: alertprocessor:9001
      SYMON_DATABASE_URL: postgres://symon:symon@db:5432/symon?sslmode=disable
      SYMON_ALERTS_CONFIG_PATH: alerts.json
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      alertprocessor:
        condition: service_started

  alertprocessor:
    build:
      context: .
      target: alertprocessor
    environment:
      <<: *symon-key
      SYMON_ALERT_PORT: "9001"

  client:
    build:
      context: .
      target: client
    environment:
      <<: *symon-key
      SYMON_CLIENT_PORT: "8080"
      SYMON_CLIENT_COLLECTOR_ENDPOINT: collector:9000
    ports:
      - "8080:8080"
    depends_on:
      - collector

  agent:
    build:
      context: .
      target: agent
    # register first. On restarts -init reports the agent exists, which is fine.
    command: ["sh", "-c", "./agent -init; exec ./agent"]
    environment:
      <<: *symon-key
      SYMON_SERVER_ID: test
      SYMON_MONITOR_INTERVAL_SECONDS: "15"
      SYMON_COLLECTOR_ENDPOINT: collector:9000
    depends_on:
      collector:
        condition: service_healthy

volumes:
  db-data:
